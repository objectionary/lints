<h1 id="duplicate-metas">Duplicate metas</h1>
<p>Metas must not be duplicated.</p>
<p>Incorrect:</p>
<pre class="eo"><code>+home https://github.com/objectionary/eo
+home https://github.com/objectionary/eo

[] &gt; foo</code></pre>
<p>Correct:</p>
<pre class="eo"><code>+home https://github.com/objectionary/eo

[] &gt; foo</code></pre>
