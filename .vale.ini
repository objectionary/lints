StylesPath = .github/styles
Vocab = Custom
MinAlertLevel = suggestion
; Pinned to specific releases so CI doesn't break when upstream style
; packages silently add or tighten rules (see #1180).
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.0/Google.zip, https://github.com/errata-ai/Microsoft/releases/download/v0.15.0/Microsoft.zip, https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, https://github.com/errata-ai/write-good/releases/download/v0.2.0/write-good.zip

[*.md]
BasedOnStyles = Vale, Google, Microsoft, proselint, write-good

Microsoft.Passive = No
Google.Passive = No
write-good.Passive = No
Microsoft.We = No
Google.We = No
Google.Will = No
Microsoft.Vocab = No
Google.Parens = No
Google.Headings = No
Microsoft.Headings = No
Microsoft.Contractions = No
Google.Contractions = No
; E-Prime bans every form of "to be", which is unworkable for the technical
; prose in these motives (see the Passive exceptions above for the same
; reasoning applied to passive voice).
write-good.E-Prime = No

[src/main/resources/org/eolang/motives/atoms/not-empty-atom.md]
Google.Units = No

[src/main/resources/org/eolang/motives/comments/ascii-only.md]
; The lint's own name is "ascii-only", so the heading cannot avoid the word.
write-good.Weasel = No
