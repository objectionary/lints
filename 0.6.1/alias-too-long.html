<h1 id="alias-too-long">Alias too long</h1>
<p>Object aliases must have <strong>at most 2 parts</strong>.</p>
<p>Incorrect:</p>
<pre class="eo"><code># Foo.

+alias a b c

[] &gt; foo</code></pre>
<p>Correct:</p>
<pre class="eo"><code># Foo.

+alias a
+alias b c
+alias d e.f.g.h

[] &gt; foo</code></pre>
