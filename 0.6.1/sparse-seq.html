<h1 id="sparse-φ.seq">Sparse <code>Φ.seq</code></h1>
<p>The <code>Φ.seq</code> object should have more than one object
inside.</p>
<p>Incorrect:</p>
<pre class="eo"><code># App.

[] &gt; app
  seq &gt; @
    *
      true</code></pre>
<p>Correct:</p>
<pre class="eo"><code># App.

[] &gt; app
  seq &gt; @
    *
      42
      true</code></pre>
