---
# yamllint disable rule:line-length
name: xslint
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: xslint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xslint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xslint/xslint-action@777f4a31c46e896457c7b36a048d110c78e34ede # 0.0.14
