---
sheets:
  - /org/eolang/lints/design/unoptimizable-recursion.xsl
defects: 0
input: |
  [] > app
    [^hunt position] > matched
      position > start
      hunt.matched-from-index > next
        position.plus 1
    [^hunt position] > matched-from-index
      if. > @
        position.gt 10
        hunt.missing
        hunt.matched position
    matched-from-index 0 > @
