---
sheets:
  - /org/eolang/lints/atoms/atom-in-atom.xsl
asserts:
  - /defects[count(defect[@severity='error'])=1]
  - /defects/defect[@line='1']
xml-reason: "the parser rejects an atom that contains an atom, in both forms
  the EO grammar allows for writing one, so this shape can only reach the
  linter as hand-written or non-EO-sourced XMIR"
document: |
  <object author="tests">
    <o name="outer" line="1">
      <o name="λ" atom="Φ.bytes"/>
      <o name="inner" line="2">
        <o name="λ" atom="Φ.bytes"/>
      </o>
    </o>
  </object>
