---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/atom-without-rt.xsl
asserts:
  - /defects[count(defect[@severity='error'])=2]
  - /defects/defect[1][normalize-space()='The "eq" atom is defined without the +rt meta, which doesn''t make any sense']
  - /defects/defect[2][normalize-space()='The "not" atom is defined without the +rt meta, which doesn''t make any sense']
  - /defects[count(defect[contains(text(), '🌵')])=0]
xml-reason: "the parser forbids auto-named atoms with >>, so @local on an atom without +rt can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o name="app">
      <o line="1" name="eq">
        <o name="λ"/>
      </o>
      <o line="2" local="not" name="a🌵2-0">
        <o name="λ"/>
      </o>
    </o>
  </object>
