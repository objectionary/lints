---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/critical/void-attributes-not-higher-than-other.xsl
asserts:
  - /defects[count(defect)=0]
xml-reason: "@local on void attributes only arises in transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o name="foo">
      <o line="1" base="∅" local="x" name="a🌵1-2"/>
      <o line="2" base="Φ.foo" name="z"/>
    </o>
  </object>
