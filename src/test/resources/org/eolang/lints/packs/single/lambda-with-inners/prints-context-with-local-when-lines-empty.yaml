---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/lambda-with-inners.xsl
asserts:
  - /defects[count(defect[@context and @severity='critical'])=1]
  - /defects/defect[1][normalize-space()='The "obj" atom has inner objects inside lambda (''λ''), which is prohibited']
  - /defects[not(defect[contains(text(), '🌵')])]
xml-reason: "the parser forbids auto-named atoms with >> and inner objects inside lambda, so this shape can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o local="obj" name="a🌵1-0">
      <o name="λ">
        <o name="foo"/>
      </o>
    </o>
  </object>
