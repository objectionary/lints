---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/atom-in-atom.xsl
asserts:
  - /defects[count(defect[@severity='error'])=1]
  - "/defects/defect[1][normalize-space()='Atom \"outer\" may not have any attributes, even if they are atoms, which however exist: \"inner\"']"
  - /defects[count(defect[contains(text(), '🌵')])=0]
xml-reason: "the parser rejects an atom that contains an atom and auto-named atoms with >>, so this shape can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o local="outer" name="a🌵1-0" line="1">
      <o name="λ" atom="Φ.bytes"/>
      <o local="inner" name="a🌵2-2" line="2">
        <o name="λ" atom="Φ.bytes"/>
      </o>
    </o>
  </object>
