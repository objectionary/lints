---
sheets:
  - /org/eolang/lints/names/unsorted-named-attributes.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='11']
  - >-
    /defects/defect[normalize-space()='Named attribute "host" is out of order
    inside formation "address"']
input: |
  # Splits an address into a host and a port.

  [text] > address
    text > @
    has-port.if > port
      text.slice
        colon.plus 1
        text.length.minus
          number (colon.plus 1)
      ""
    if. > host
      not. >> has-port
        eq.
          text.index-of ":" >> colon
          -1
      text.slice 0 colon
      text
