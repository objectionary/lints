---
sheets:
  - /org/eolang/lints/misc/redundant-object.xsl
defects: 0
input: |
  # A cell that knows whether it holds zero.

  [] > app
    [x] > cell
      x.eq 0 > empty
      empty.if > shown
        "zero"
        "other"
    cell 0 > c
    c.empty.if > @
      c.shown
      "?"
