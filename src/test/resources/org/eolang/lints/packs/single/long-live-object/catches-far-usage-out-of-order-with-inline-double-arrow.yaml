---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/design/long-live-object.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][@line='4' and contains(normalize-space(), 'The object "m" is declared here, but is not used until line 12')]
input: |
  # App.

  [x] > app
    x.plus 1 > m
    times. > b
      x.minus 2 >> diff
      diff
    1 > c
    2 > d
    3 > e
    4 > f
    m.plus b > g
