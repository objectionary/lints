---
sheets:
  - /org/eolang/lints/tests/wrong-test-order.xsl
asserts:
  - /defects[count(defect[@severity='warning' and @line='3'])=1]
  - /defects/defect[contains(text(), '"runs-program"')]
ignore-schema: true
document: |
  <object author="tests">
    <o line="1" name="foo">
      <o line="2" name="bar"/>
      <o line="3" name="p🌵runs-program"/>
      <o line="4" name="boom"/>
    </o>
  </object>
