---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/design/unoptimizable-recursion.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][normalize-space()='The recursion in "calc" cannot be turned into a loop, the self-call names the formation directly instead of through its receiver']
input: |
  [] > calc
    seq > @
      *
        1
        calc (n.minus 1)
