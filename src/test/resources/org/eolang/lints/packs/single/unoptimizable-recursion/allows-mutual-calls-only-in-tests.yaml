sheets:
  - /org/eolang/lints/design/unoptimizable-recursion.xsl
defects: 0
input: |
  [] > app
    [n] > even
      n.eq 0 > @
    [n] > odd
      n.eq 1 > @
    even 10 > @

    [] +> checks-even-and-odd
      and. > @
        ^.even 0
        ^.odd 1
