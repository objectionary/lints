# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/comments/comment-is-too-wide.xsl
defects:
  - severity: warning
    line: 1
input: |
  # Prints the "Hello,\nWorld!" text to the standard output, and this comment line is wider than one hundred chars.

  [] > foo
    42 > @
