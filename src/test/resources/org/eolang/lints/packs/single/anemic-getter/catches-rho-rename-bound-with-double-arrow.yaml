---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/misc/anemic-getter.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][@line='2' and normalize-space()='The object "up" is a redundant getter, it just renames "^" without adding anything, use "^" directly instead']
  - /defects/defect[not(contains(text(), '🌵'))]
input: |
  [] > foo
    ^ >> up
    up > @
