---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/atom-and-base.xsl
asserts:
  - /defects[count(defect[@context and @severity='critical'])=1]
  - /defects/defect[1][normalize-space()='The atom "obj" may not have the "@base" attribute, which however exists with "Φ.foo"']
  - /defects/defect[not(contains(text(), '🌵'))]
xml-reason: "the parser forbids auto-named atoms with >> and atoms with @base, so this shape can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o local="obj" name="a🌵1-0" base="Φ.foo">
      <o name="λ"/>
    </o>
  </object>
