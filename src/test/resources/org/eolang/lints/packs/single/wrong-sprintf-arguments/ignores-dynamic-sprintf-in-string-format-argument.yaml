---
sheets:
  - /org/eolang/lints/misc/wrong-sprintf-arguments.xsl
defects: 0
input: |
  [fmt args kid] > log
    seq > @
      *
        stdout
          magenta
            "\033[90m%s\033[0m\n".printf
              *
                fmt.printf
                  * args
        kid
