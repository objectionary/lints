---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/design/unoptimizable-recursion.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][@line='9' and normalize-space()='The recursion in "rec" cannot be turned into a loop, the self-call sits under a choice by an object that may not be a boolean']
input: |
  [] > app
    [] > cond
      [a b] > if
        a > @
    [n] > rec
      if. > @
        ^.cond
        0
        n.plus (^.rec (n.minus 1))
    rec 5 > @
