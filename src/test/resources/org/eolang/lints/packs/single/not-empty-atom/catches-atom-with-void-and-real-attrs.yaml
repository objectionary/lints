---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/not-empty-atom.xsl
asserts:
  - /defects[count(defect[@severity='error'])=1]
  - /defects/defect[not(contains(., 'foo'))]
document: |
  <object author="tests">
    <o line="1" name="number">
      <o base="∅" name="λ"/>
      <o base="∅" name="foo"/>
      <o base="Φ.bar" name="baz"/>
    </o>
  </object>
