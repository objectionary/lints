---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/not-empty-atom.xsl
asserts:
  - /defects[count(defect[@severity='error'])=1]
  - "/defects/defect[1][normalize-space()='The atom \"bytes\" may not have any attributes, which however exist: \"first\", \"second\"']"
  - /defects/defect[not(contains(text(), '🌵'))]
xml-reason: "atom body rejects non-test attrs at parse time"
document: |
  <object author="tests">
    <o line="1" local="bytes" name="a🌵1-0">
      <o base="∅" name="λ"/>
      <o base="Φ.foo" local="first" name="a🌵2-2"/>
      <o base="Φ.bar" local="second" name="a🌵3-2"/>
    </o>
  </object>
