---
sheets:
  - /org/eolang/lints/design/excessive-visibility.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='4']
  - /defects/defect[contains(text(), 'is-macos')]
input: |
  [] > os
    name > @
    name.contains "Linux" > is-linux
    name.contains "Mac" > is-macos
    [] > name /Q.string
      ? > ^

    os.is-linux ++> can-check-the-os-family
