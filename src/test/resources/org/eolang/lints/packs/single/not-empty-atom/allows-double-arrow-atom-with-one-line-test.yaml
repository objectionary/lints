---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/not-empty-atom.xsl
asserts:
  - /defects[count(defect)=0]
xml-reason: "the parser forbids auto-named atoms with >>, so @local on an atom with a one-line test can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o line="1" local="foo" name="a🌵1-0">
      <o base="∅" name="λ"/>
      <o base="Φ.true" line="3" local="p🌵can-work" name="a🌵3-2"/>
    </o>
  </object>
