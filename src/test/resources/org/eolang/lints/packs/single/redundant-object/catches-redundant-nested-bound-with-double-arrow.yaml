---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/misc/redundant-object.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][@line='3' and normalize-space()='The object "tmp" is redundant and may be inlined']
  - /defects/defect[not(contains(text(), '🌵'))]
input: |
  [] > outer
    [x] >> inner
      x.plus 1 >> tmp
      tmp.times 2 > @
    inner 5 > @
