---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/misc/identity-object.xsl
asserts:
  - /defects[count(defect[@severity='warning' and @experimental='true'])=2]
  - /defects/defect[1][normalize-space()='The formation "regular" is a handwritten identity object and may be replaced with the "I" glyph']
  - /defects/defect[2][normalize-space()='The formation "arrow" is a handwritten identity object and may be replaced with the "I" glyph']
  - /defects[count(defect[contains(text(), '🌵')])=0]
input: |
  [] > app
    [x] > regular
      x > @
    [y] >> arrow
      y > @
