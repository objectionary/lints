---
sheets:
  - /org/eolang/lints/misc/sprintf-constant-args.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=0]
input: |
  [name] > app
    io.stdout > @
      txt.sprintf
        "Hello, %s and %s!"
        *
          "Jeff"
          name
