---
sheets:
  - /org/eolang/lints/design/excessive-visibility.xsl
defects: 0
input: |
  +package com.example

  [] > os
    name > @
    name.contains "Linux" > is-linux
    name.contains "Mac" > is-macos
    name.contains "Windows" > is-windows
    [] > name /Q.string
      ? > ^

    or. ++> can-check-the-os-family
      os.is-windows.or os.is-macos
      os.is-linux
