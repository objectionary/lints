---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/names/duplicate-as-attribute.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][normalize-space()='The object "inner" has duplicated @as attribute "k"']
  - /defects/defect[not(contains(text(), '🌵'))]
input: |
  [] > outer
    t f1:k f2:k >> inner
