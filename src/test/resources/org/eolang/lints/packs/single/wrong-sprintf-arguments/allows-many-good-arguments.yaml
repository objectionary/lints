---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/misc/wrong-sprintf-arguments.xsl
defects: 0
input: |
  [] > app
    io.stdout > @
      "Hello, %s (%x, match: %b)! Your account is %d, your temperature %f.".printf
        * name name.as-bytes true acc t
