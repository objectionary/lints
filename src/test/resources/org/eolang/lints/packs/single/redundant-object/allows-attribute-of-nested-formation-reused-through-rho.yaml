---
sheets:
  - /org/eolang/lints/misc/redundant-object.xsl
defects: 0
input: |
  # A number that never goes over a limit.

  [n] > clamped
    [] >> limits
      100 > max
    [x] > clamp
      if. > @
        x.gt ^.limits.max
        ^.limits.max
        x
    clamp n > @
