---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/lambda-with-inners.xsl
asserts:
  - /defects[count(defect[@severity='critical'])=2]
  - /defects/defect[1][normalize-space()='The "first" atom has inner objects inside lambda (''λ''), which is prohibited']
  - /defects/defect[2][normalize-space()='The "second" atom has inner objects inside lambda (''λ''), which is prohibited']
  - /defects[count(defect[contains(text(), '🌵')])=0]
xml-reason: "the parser forbids auto-named atoms with >> and inner objects inside lambda, so this shape can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o name="app">
      <o line="1" name="first">
        <o name="λ">
          <o name="a"/>
        </o>
      </o>
      <o line="2" local="second" name="a🌵2-0">
        <o name="λ">
          <o name="b"/>
        </o>
      </o>
    </o>
  </object>
