        <head>alias</head>
        <tail>sprintf Φ.org.eolang.txt.sprintf</tail>
        <part>sprintf</part>
        <part>Φ.org.eolang.txt.sprintf</part>
      </meta>
    </metas>
    <o name="foo"/>
  </object>
