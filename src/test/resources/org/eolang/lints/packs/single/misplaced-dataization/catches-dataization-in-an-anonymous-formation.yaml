---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/design/misplaced-dataization.xsl
asserts:
  - /defects[count(defect)=1]/defect[@line='6' and normalize-space()='The dataization in the formation at line 5 reads only objects outside of it and runs again in every copy, move it up into the formation at line 2']
input: |
  [] > outer
    [^] >>
      reduced > @
        items
        [acc x]
          acc.plus ^.weight! > @
