---
sheets:
  - /org/eolang/lints/critical/named-object-abstract-nested.xsl
asserts:
  - /defects[count(defect[@severity='critical'])=1]
  - /defects/defect[@line='3' and contains(text(), '"nested"')]
  - /defects/defect[not(contains(text(), '🌵'))]
xml-reason: "vars-float-up relocates named nested objects to top"
document: |
  <object author="tests">
    <o name="foo" line="1">
      <o base="Φ.xyz" line="2">
        <o base="Φ.num" name="a🌵2-2" local="nested" line="3"/>
      </o>
    </o>
  </object>
