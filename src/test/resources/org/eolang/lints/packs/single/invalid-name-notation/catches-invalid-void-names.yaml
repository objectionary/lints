---
sheets:
  - /org/eolang/lints/names/invalid-name-notation.xsl
asserts:
  - /defects[count(defect[@severity='warning' and @line='1'])=2]
  - /defects/defect[contains(text(), '"fooBar"')]
  - /defects/defect[contains(text(), '"f_x"')]
input: |
  [fooBar f_x good] > app
    fooBar.plus f_x > @
