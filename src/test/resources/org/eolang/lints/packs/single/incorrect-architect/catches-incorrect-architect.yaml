    line: 1
  - severity: warning
    line: 2
  - severity: warning
    line: 3
  - severity: warning
    line: 4
  - severity: warning
    line: 6
input: |
  +architect hello
  +architect hello@mail
  +architect someone@@
  +architect @gmail.com
  +architect hello@gmail.com
  +architect someone24@.com
  +architect hello@mail.ru
  +alias org.eolang.io.stdout

  [x] > foo
    x.div in.nextInt > @
