---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/errors/many-void-attributes.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=2]
  - /defects/defect[1][normalize-space()=concat('The object "first" has more than 5 void attributes, it', "'", 's too many')]
  - /defects/defect[2][normalize-space()=concat('The object "second" has more than 5 void attributes, it', "'", 's too many')]
  - /defects[count(defect[contains(text(), '🌵')])=0]
input: |
  [a b c d e f] > first
    [g h i j k l] >> second
      0 > @
