---
sheets:
  - /org/eolang/lints/tests/wrong-test-order.xsl
defects:
  - severity: warning
    line: 3
ignore-schema: true
xml-reason: "vars-float-up always sorts tests after other attrs"
document: |
  <object author="tests">
    <o line="1" name="foo">
      <o line="2" name="bar"/>
      <o line="3" name="+runs-program"/>
      <o line="4" name="boom"/>
    </o>
  </object>
