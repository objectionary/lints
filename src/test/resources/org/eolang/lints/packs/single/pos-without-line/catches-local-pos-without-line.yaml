---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/critical/pos-without-line.xsl
asserts:
  - /defects[count(defect[@context and @severity='critical'])=1]
  - /defects/defect[1][normalize-space()='Object "foo" have the "@pos" attribute, but the "@line" attribute is absent']
  - /defects[not(defect[contains(text(), '🌵')])]
xml-reason: "@pos without @line is unreachable via valid parse"
document: |
  <object author="tests">
    <o pos="3" local="foo" name="a🌵1-3"/>
  </object>
