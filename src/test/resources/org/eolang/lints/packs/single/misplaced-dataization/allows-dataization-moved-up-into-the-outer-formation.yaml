---
sheets:
  - /org/eolang/lints/design/misplaced-dataization.xsl
defects: 0
input: |
  [^ items] > joined
    ^ >> delimiter!
    [^ acc tup] >> with-delimiter
      if. > @
        tup.length.eq 0
        acc
        ^.with-delimiter
          concat.
            concat. (dataized tup.head) ^.delimiter
            acc
          tup.tail
