---
sheets:
  - /org/eolang/lints/tests/wrong-test-order.xsl
defects:
  - severity: warning
    line: 2
ignore-schema: true
xml-reason: "vars-float-up always sorts tests after other attrs"
document: |
  <object author="tests">
    <o line="1" name="app">
      <o line="2" name="+runs"/>
      <o line="3" name="x"/>
      <o line="4" name="+something"/>
    </o>
  </object>
