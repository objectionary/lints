---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/critical/bytes-without-data.xsl
asserts:
  - /defects[count(defect[@severity='critical'])=2]
  - /defects/defect[1][normalize-space()='Objects with parent @base equal to "Φ.bytes" must contain data, while "first" object does not']
  - /defects/defect[2][normalize-space()='Objects with parent @base equal to "Φ.bytes" must contain data, while "second" object does not']
  - /defects[count(defect[contains(text(), '🌵')])=0]
xml-reason: "the parser always emits data inside Φ.bytes, so an empty Φ.bytes formation can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o name="app">
      <o name="first" base="Φ.bytes" line="1">
        <o/>
      </o>
      <o local="second" name="a🌵2-0" base="Φ.bytes" line="2">
        <o/>
      </o>
    </o>
  </object>
