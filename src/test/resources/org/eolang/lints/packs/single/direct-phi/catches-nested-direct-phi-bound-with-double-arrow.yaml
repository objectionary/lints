---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/errors/direct-phi.xsl
asserts:
  - /defects[count(defect[@severity='error' and @experimental='true'])=1]
  - /defects/defect[1][normalize-space()='The object "leaf" uses "@" attribute directly, while it is prohibited']
  - /defects/defect[not(contains(text(), '🌵'))]
input: |
  [] > outer
    [] >> inner
      x.@ >> leaf
