---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/atom-and-base.xsl
asserts:
  - /defects[count(defect[@severity='critical'])=2]
  - /defects/defect[1][normalize-space()='The atom "first" may not have the "@base" attribute, which however exists with "Φ.x"']
  - /defects/defect[2][normalize-space()='The atom "second" may not have the "@base" attribute, which however exists with "Φ.y"']
  - /defects[count(defect[contains(text(), '🌵')])=0]
xml-reason: "the parser forbids auto-named atoms with >> and atoms with @base, so this shape can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o name="app">
      <o line="1" name="first" base="Φ.x">
        <o name="λ"/>
      </o>
      <o line="2" local="second" name="a🌵2-0" base="Φ.y">
        <o name="λ"/>
      </o>
    </o>
  </object>
