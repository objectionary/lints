---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/design/long-live-object.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][@line='2' and contains(normalize-space(), 'The object "f" is declared here, but is not used until line 9, 7 lines away; move its declaration closer to where')]
  - /defects/defect[not(contains(text(), '🌵'))]
input: |
  [] > app
    foo 42 >> f
    1 > a
    2 > b
    3 > c
    4 > d
    5 > e
    6 > g
    52.plus f > r
