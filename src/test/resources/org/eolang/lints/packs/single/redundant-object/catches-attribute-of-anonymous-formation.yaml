---
sheets:
  - /org/eolang/lints/misc/redundant-object.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='6' and contains(., '"padding"')]
input: |
  # The size of an address.

  [] > net
    measured > @
      [host] >>
        00-00-00-00 > padding
        host.size.plus padding.size > @
