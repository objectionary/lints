---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/design/unoptimizable-recursion.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][normalize-space()='The recursion in "rec" cannot be turned into a loop, the self-call is kept in an attribute other than φ']
input: |
  [] > app
    [n] > rec
      ^.rec (n.minus 1) > cached
      n.plus 1 > @
    rec 5 > @
