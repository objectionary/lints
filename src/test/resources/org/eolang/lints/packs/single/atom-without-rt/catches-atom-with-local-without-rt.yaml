---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/atoms/atom-without-rt.xsl
asserts:
  - /defects[count(defect[@severity='error'])=1]
  - /defects/defect[1][normalize-space()='The "eq" atom is defined without the +rt meta, which doesn''t make any sense']
  - /defects[not(defect[contains(text(), '🌵')])]
xml-reason: "the parser forbids auto-named atoms with >>, so @local on an atom without +rt can only reach the linter via transformed or hand-written XMIR"
document: |
  <object author="tests">
    <o line="1" local="eq" name="a🌵1-0">
      <o name="λ"/>
    </o>
  </object>
