---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/design/long-live-object.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[1][@line='3' and contains(normalize-space(), 'The object "seed" is declared here, but is not used until line 10, 7 lines away; move its declaration closer to where')]
  - /defects/defect[not(contains(text(), '🌵'))]
input: |
  [] > outer
    [x] >> inner
      x.plus 1 >> seed
      1 > s1
      2 > s2
      3 > s3
      4 > s4
      5 > s5
      6 > s6
      seed.times 2 > @
    inner 5 > @
