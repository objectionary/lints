---
sheets:
  - /org/eolang/lints/misc/sprintf-constant-args.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='3']
input: |
  [] > app
    io.stdout > @
      txt.sprintf
        "%s %s"
        *
          "hello"
          "world!"
