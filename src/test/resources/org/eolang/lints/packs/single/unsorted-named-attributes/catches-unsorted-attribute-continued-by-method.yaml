---
sheets:
  - /org/eolang/lints/names/unsorted-named-attributes.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='4']
  - >-
    /defects/defect[normalize-space()='Named attribute "size" is out of order
    inside formation "summary"']
input: |
  [text] > summary
    42 > zero
    text.trimmed > clean
    .length > size
