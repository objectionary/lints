  - /org/eolang/lints/design/unoptimizable-recursion.xsl
defects: 0
input: |
  [] > app
    [n] > countdown
      if. > @
        n.lt 1
        0:left
        (^.countdown (n.minus 1)):right
    countdown 5 > @
