---
sheets:
  - /org/eolang/lints/tests/test-word.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=2]
  - /defects/defect[@line='2' and contains(., 'object "test-adds-two"')]
  - /defects/defect[@line='3' and contains(., 'object "test-fails-on"')]
ignore-schema: true
xml-reason: "pinned eo-parser emits +/-, not p🌵/n🌵 cactus markers"
document: |
  <object author="tests">
    <o line="1" name="sum">
      <o line="2" name="p🌵test-adds-two"/>
      <o line="3" name="n🌵test-fails-on"/>
    </o>
  </object>
