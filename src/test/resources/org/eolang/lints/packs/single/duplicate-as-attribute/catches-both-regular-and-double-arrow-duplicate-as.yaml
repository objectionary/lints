---
sheets:
  - /org/eolang/lints/names/duplicate-as-attribute.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=2]
  - >-
    /defects/defect[1][normalize-space()=
    'The object "regular" has duplicated @as attribute "a"']
  - >-
    /defects/defect[2][normalize-space()=
    'The object "arrow" has duplicated @as attribute "b"']
  - /defects[count(defect[contains(text(), '🌵')])=0]
xml-reason: "0.63.5 rejects duplicate argument bindings at parse time"
document: |
  <object author="tests">
    <o line="1" name="app">
      <o base="&#x3A6;.t" line="2" name="regular">
        <o as="a" base="&#x3A6;.f1" line="2"/>
        <o as="a" base="&#x3A6;.f2" line="2"/>
      </o>
      <o base="&#x3A6;.t" line="3" local="arrow" name="a🌵3-4">
        <o as="b" base="&#x3A6;.f1" line="3"/>
        <o as="b" base="&#x3A6;.f2" line="3"/>
      </o>
    </o>
  </object>
