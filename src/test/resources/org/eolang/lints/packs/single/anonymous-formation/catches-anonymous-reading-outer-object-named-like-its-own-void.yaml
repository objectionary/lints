---
sheets:
  - /org/eolang/lints/names/anonymous-formation.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='8']
  - /defects/defect[contains(., 'undefined object "x" inside')]
input: |
  # Counts the items equal to the given one.

  [items x] > occurrences
    items.reduced > @
      0
      [acc x]
        if. > @
          x.eq ^.x
          acc.plus 1
          acc
