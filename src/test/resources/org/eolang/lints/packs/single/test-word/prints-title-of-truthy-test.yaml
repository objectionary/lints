---
sheets:
  - /org/eolang/lints/tests/test-word.xsl
asserts:
  - /defects[count(defect[@severity='warning' and @line='4'])=1]
  - /defects/defect[contains(., 'object "test-adds-two-numbers" must')]
input: |
  [x] > sum
    x.plus 2 > @

    [] +> test-adds-two-numbers
      (sum 2).eq 4 > @
