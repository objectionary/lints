input: |
  [x] > foo
    0 > @
    if. > a1
      x
      1
      2
    [y] > bar
      0 > @
      if. > b1
        y
        1
        2
      if. > b2
        y
        1
        2
      if. > b3
        y
        1
        2
      if. > b4
        y
        1
        2
      if. > b5
        y
        1
        2
      if. > b6
        y
        1
        2
      if. > b7
        y
        1
        2
      if. > b8
        y
        1
        2
      if. > b9
        y
        1
        2
      if. > b10
        y
        1
        2
      if. > b11
        y
        1
        2
