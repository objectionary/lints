---
sheets:
  - /org/eolang/lints/design/excessive-visibility.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='5']
  - /defects/defect[contains(text(), 'previous')]
input: |
  # A counter that steps from a given value.

  [start] > counter
    start.plus 1 > next
    start.minus 1 > previous

    42.next.eq 43 ++> can-move-to-the-next-value
