---
sheets:
  - /org/eolang/lints/aliases/unused-alias.xsl
defects:
  - severity: error
    line: 1
  - severity: error
    line: 3
input: |
  +alias err org.eolang.io.stderr
  +alias in org.eolang.io.stdin
  +alias org.eolang.io.stdout

  [x] > foo
    x.div in.nextInt > @
