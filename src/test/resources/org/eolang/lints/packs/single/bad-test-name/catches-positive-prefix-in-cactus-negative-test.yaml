---
sheets:
  - /org/eolang/lints/tests/bad-test-name.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[contains(text(), 'negative test object "can-do-something"')]
ignore-schema: true
document: |
  <object author="tests">
    <o line="1" name="foo">
      <o line="2" name="n🌵can-do-something"/>
    </o>
  </object>
