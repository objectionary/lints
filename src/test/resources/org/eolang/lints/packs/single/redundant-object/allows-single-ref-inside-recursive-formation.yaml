---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/lints/misc/redundant-object.xsl
defects: 0
input: |
  # Series.
  [point] > series
    point.times point > squared
    poly 30 > @
    [n] > poly
      if. > @
        n.eq 0
        0
        squared.plus (poly (n.minus 1))
