---
sheets:
  - /org/eolang/lints/misc/wrong-sprintf-arguments.xsl
defects:
  - severity: warning
    line: 3
asserts:
  - /defects/defect[contains(., 'a tuple of 2 element(s)')]
input: |
  [name] > app
    io.stdout > @
      "Hello, %s %s!".printf
        * name
