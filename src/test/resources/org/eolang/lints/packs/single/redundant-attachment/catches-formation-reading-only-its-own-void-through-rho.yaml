---
sheets:
  - /org/eolang/lints/misc/redundant-attachment.xsl
asserts:
  - /defects[count(defect[@severity='warning'])=1]
  - /defects/defect[@line='6']
input: |
  # Counts the items equal to zero.

  [items] > zeros
    items.reduced > @
      0
      [acc x] >>
        if. > @
          same
          acc.plus 1
          acc
        [] > same
          ^.x.eq 0 > @
