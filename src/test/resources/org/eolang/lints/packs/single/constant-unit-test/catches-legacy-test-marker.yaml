---
sheets:
  - /org/eolang/lints/tests/constant-unit-test.xsl
asserts:
  - /defects[count(defect)=1]
  - /defects/defect[@line='5' and contains(., '"works"')]
ignore-schema: true
xml-reason: "legacy '+' test marker; the parser now emits p🌵"
document: |
  <object author="tests">
    <o line="2" name="foo">
      <o line="3" name="x" base="Φ.true"/>
      <o line="4" name="+works">
        <o line="5" name="φ" base="Φ.number">
          <o as="α0" base="Φ.bytes"><o as="α0">40-45-00-00-00-00-00-00</o></o>
        </o>
      </o>
    </o>
  </object>
