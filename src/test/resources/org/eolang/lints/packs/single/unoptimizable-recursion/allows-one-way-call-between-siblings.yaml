sheets:
  - /org/eolang/lints/design/unoptimizable-recursion.xsl
defects: 0
input: |
  [] > app
    [n] > twice
      n.times 2 > @
    [n] > rec
      if. > @
        n.lt 1
        0
        ^.rec (^.twice n)
    rec 5 > @
