<h1 id="reserved-name">Reserved name</h1>
<p>Object names must not duplicate reserved names from
<code>org.eolang.*</code> objects <a
href="https://github.com/objectionary/home/tree/master/objects/org/eolang">located
in home</a>.</p>
<p>Incorrect:</p>
<pre class="eo"><code># Foo.

[] &gt; foo
  52 &gt; true</code></pre>
<p>Since <code>true</code> already exists in
<code>org.eolang.true.eo</code>.</p>
<p>Published on Sat Nov 28 06:43:44 UTC 2026.</p>
