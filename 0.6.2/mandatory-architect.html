<h1 id="mandatory-architect-meta">Mandatory <code>+architect</code>
Meta</h1>
<p>The program must have a single <code>+architect</code> special
meta.</p>
<p>Incorrect:</p>
<pre class="eo"><code>[] &gt; foo</code></pre>
<p>Correct:</p>
<pre class="eo"><code>+architect foo@example.com

[] &gt; foo</code></pre>
